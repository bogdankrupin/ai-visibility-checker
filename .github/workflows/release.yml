name: Build extension zip

on:
  push:
    branches: [main]
    paths: ["extension/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest
        id: v
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Zip extension
        run: cd extension && zip -r ../ai-visibility-checker.zip . -x "*.DS_Store"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AI Visibility Checker v${{ steps.v.outputs.version }}
          make_latest: true
          files: ai-visibility-checker.zip
          body: |
            Download **ai-visibility-checker.zip** below and install it following the README.
