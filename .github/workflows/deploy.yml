name: Deploy backend and release extension

on:
  push:
    branches: [main]
    paths: ["extension/**", "worker/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SERANKING_API_KEY: ${{ secrets.SERANKING_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository secrets
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$SERANKING_API_KEY" ] && missing="$missing SERANKING_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Add these secrets in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create or reuse the KV namespace
        working-directory: worker
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$AUTH" "$API?per_page=100" | jq -r '.result[]? | select(.title=="ai-visibility-checker-cache") | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" --data '{"title":"ai-visibility-checker-cache"}' "$API" | jq -r '.result.id // empty')
          fi
          if [ -z "$ID" ]; then
            echo "::error::Couldn't create the KV namespace. Check that the Cloudflare token has 'Workers KV Storage: Edit' permission."
            exit 1
          fi
          sed -i "s/__KV_NAMESPACE_ID__/$ID/" wrangler.toml

      - name: Deploy the worker
        id: deploy
        working-directory: worker
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::No workers.dev address. Open Cloudflare dashboard > Workers & Pages once to create your workers.dev subdomain, then re-run."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Store the SE Ranking key in the worker
        working-directory: worker
        run: echo "$SERANKING_API_KEY" | npx --yes wrangler@4 secret put SERANKING_API_KEY

      - name: Health check
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/health"

      - name: Build the extension zip
        id: build
        run: |
          sed -i "s#__WORKER_URL__#${{ steps.deploy.outputs.url }}#" extension/config.js
          echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"
          cd extension && zip -r ../ai-visibility-checker.zip . -x "*.DS_Store"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version }}
          name: AI Visibility Checker v${{ steps.build.outputs.version }}
          make_latest: true
          files: ai-visibility-checker.zip
          body: |
            Download **ai-visibility-checker.zip** below and install it following the README.
            No API keys needed.
